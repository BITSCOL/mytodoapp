name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Run Rubocop
        run: bin/rubocop -f github

  test:
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:password@localhost:5432/mytodoapp_test
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Code
          uses: actions/checkout@v6
        - name: Setup Ruby
          uses: ruby/setup-ruby@v1
          with:
            bundler-cache: true
        - name: Prepare DB
          run: bin/rails db:prepare
        - name: Run Tests
          run: bin/rails spec

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Scan for Vulnerabilities
        run: bin/brakeman --no-pager